name: 新增情绪知识条目
description: 提交可转化为演员行为的情绪材料、观察或测试结果
title: "[Emotion] "
labels: ["knowledge-base"]
body:
  - type: dropdown
    id: source_type
    attributes:
      label: 内容类型
      options:
        - 实际生成测试
        - 个人表演观察
        - 原文摘录
        - 失败案例与修正
    validations:
      required: true
  - type: input
    id: emotion
    attributes:
      label: 对应情绪
      placeholder: 例如：迟发、克制的悲伤
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 适用人物、关系与场景
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 触发事件与情绪阶段
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 可见或可听的表演证据
      description: 请写眼神、面部、身体、重心、声音、呼吸、停顿或未完成行动。
    validations:
      required: true
  - type: textarea
    id: avoid
    attributes:
      label: 表演禁区或失败表现
  - type: textarea
    id: source
    attributes:
      label: 来源与验证说明
