name: New emotion knowledge entry
description: Submit emotion material, observations or test results that can be turned into actor behaviour
title: "[Emotion] "
labels: ["knowledge-base"]
body:
  - type: dropdown
    id: source_type
    attributes:
      label: Content type
      options:
        - Real generation test
        - Personal performance observation
        - Quotation
        - Failure case and fix
    validations:
      required: true
  - type: input
    id: emotion
    attributes:
      label: Emotion
      placeholder: "For example: delayed, restrained sadness"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Characters, relationships and scenes it applies to
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Trigger event and emotional stages
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Visible or audible performance evidence
      description: Describe gaze, face, body, weight, voice, breath, pauses or unfinished actions.
    validations:
      required: true
  - type: textarea
    id: avoid
    attributes:
      label: Forbidden reactions or failure signs
  - type: textarea
    id: source
    attributes:
      label: Source and verification notes
